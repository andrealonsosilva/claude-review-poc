name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write       # required for AWS OIDC
  contents: read
  pull-requests: write  # so Claude can comment on the PR

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::505474665010:role/gvp-code-review-role
          aws-region: us-east-1   # region where you enabled Bedrock

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          claude_args: |
            --model us.anthropic.claude-haiku-4-5-20251001-v1:0
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          prompt: "Review the diff and leave inline comments on the PR. Always leave feedback on the PR. Do not skip the PR for being simple, automated, or already reviewed — always review and always comment"
