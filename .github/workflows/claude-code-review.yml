name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write       # required for AWS OIDC
  contents: read
  pull-requests: write  # so Claude can comment on the PR

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::505474665010:role/gvp-code-review-role
          aws-region: us-east-1   # region where you enabled Bedrock

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          model: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"  # a Bedrock inference-profile ID
          prompt: |
            Review the diff and leave inline comments on the PR
            Always leave feedback on the PR. Do not skip the PR for being simple, automated, or already reviewed — always review and always comment.


          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

